name: Cron

# Vercel Hobby only allows daily crons, so this calls both cron endpoints
# every 10 minutes. Needs repository secrets APP_URL and CRON_SECRET; it
# does nothing until both are set. Both endpoints are idempotent.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call cron endpoints
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET secret not set; skipping."
            exit 0
          fi
          for path in publish autopilot; do
            curl --fail-with-body -sS --max-time 70 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "${APP_URL%/}/api/cron/$path"
            echo
          done
